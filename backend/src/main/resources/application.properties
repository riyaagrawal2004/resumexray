spring.application.name=resumexray

# Local-only secrets file (gitignored). Create it once for local dev - see application-secrets.properties.example.
spring.config.import=optional:file:./application-secrets.properties

# ---- PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resumexray}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- JWT ----
jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_MIN_32_CHARS}
jwt.expiration-ms=86400000

# ---- Groq (free, OpenAI-compatible) ----
groq.api-key=${GROQ_API_KEY:}
groq.base-url=https://api.groq.com/openai/v1/chat/completions
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# ---- CORS ----
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

server.port=${PORT:8080}